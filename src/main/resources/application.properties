# ==============================================================================
# Local Fashion Marketplace - Application Configuration
# ==============================================================================

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration (Environment variable overrides supported)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/local_fashion_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Security Configuration (Never hardcode production secrets)
# Default 256-bit secret key for development; override via JWT_SECRET in production
app.jwt.secret=${JWT_SECRET:9a6747f3b64c61d4e800d3780de47b40d69e4a1b0fa7402ed04b694ab310528f}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OpenAPI & Swagger UI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
